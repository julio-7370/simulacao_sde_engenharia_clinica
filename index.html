<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Simulação de Depreciação Estocástica</title>

  <link rel="stylesheet" href="styles.css" />
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <script src="main.js" defer></script>
</head>
<body>

  <h1>🩺 Simulação de Saúde do Equipamento</h1>

  <div class="dashboard">

    <div class="card controls">

      <div class="control-group">
        <label>Estado inicial (X₀): <span id="X0Val"></span></label>
        <input type="range" id="X0" min="50" max="120" value="100" step="1">
      </div>

      <div class="control-group">
        <label>Taxa de desgaste (μ): <span id="muVal"></span></label>
        <input type="range" id="mu" min="0.001" max="0.05" value="0.003" step="0.001">
      </div>

      <div class="control-group">
        <label>Intensidade do ruído (σ): <span id="sigmaVal"></span></label>
        <input type="range" id="sigma" min="0.01" max="0.2" value="0.1" step="0.001">
      </div>

      <div class="control-group">
        <label>Limite de falha (Xlim): <span id="XlimVal"></span></label>
        <input type="range" id="Xlim" min="10" max="80" value="30" step="5">
      </div>

      <div class="control-group">
        <label>Passo temporal (dt): <span id="dtVal"></span></label>
        <input type="range" id="dt" min="0.1" max="2" value="1" step="0.1">
      </div>

      <div class="control-group">
        <label>Intervalo manutenção preditiva: <span id="predVal"></span></label>
        <input type="range" id="predictiveInterval" min="10" max="200" value="50" step="10">
      </div>

      <div class="control-group">
        <label>Eficácia da manutenção corretiva (α): <span id="alphaVal"></span></label>
        <input type="range" id="alpha" min="0.0" max="1.0" value="0.80" step="0.01">
      </div>


    </div>

    <div class="card chart-card">
      <canvas id="simulationChart"></canvas>
      <canvas id="probabilityChart"></canvas> 
      <div id="statusIndicator" class="status healthy">Estado: Saudável</div>
    </div>

  </div>

  <div class="buttons">
    <button onclick="startSimulation()">▶ Iniciar</button>
    <button onclick="stopSimulation()">⏸ Parar</button>
    <button onclick="resetSimulation()">🔄 Resetar</button>
  </div>

</body>
</html>
